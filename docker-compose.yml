services:
  postgres:
    image: postgres:16-alpine
    container_name: ads_optimizer_postgres
    environment:
      POSTGRES_DB: ads_optimizer
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizer -d ads_optimizer"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ads_optimizer_backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://optimizer:optimizer@postgres:5432/ads_optimizer
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ads_optimizer_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
